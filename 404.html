<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>页面不存在 · dshjob</title>
  <meta name="description" content="dshjob.com 的 404 页面：你要找的页面不存在或已移动，可回到首页或查看使用教程。">
  <meta name="robots" content="noindex">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #F2F7FC;
      color: #16324F;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.65;
    }
    .card {
      width: 100%;
      max-width: 420px;
      padding: 40px 32px;
      background: #FFFFFF;
      border: 1px solid #C8DAEB;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(22, 50, 79, 0.06);
      text-align: center;
    }
    .code {
      margin: 0 0 8px;
      font-size: 56px;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: 2px;
      color: #2563EB;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 20px;
    }
    .lead {
      margin: 0 0 28px;
      font-size: 16px;
      color: #516579;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 0;
    }
    .actions a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 16px;
      text-decoration: none;
    }
    .actions .primary {
      background: #2563EB;
      color: #FFFFFF;
    }
    .actions .primary:hover {
      background: #1D4ED8;
    }
    .actions .secondary {
      background: #FFFFFF;
      color: #2563EB;
      border: 1px solid #C8DAEB;
    }
    .actions .secondary:hover {
      border-color: #2563EB;
    }
    .actions a:focus-visible {
      outline: 3px solid #3689F5;
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <main class="card">
    <p class="code">404</p>
    <h1>这个页面不存在或已移动。</h1>
    <p class="lead">你可以回到首页重新找找，或直接查看使用教程。</p>
    <p class="actions">
      <a class="primary" href="index.html">回到首页</a>
      <a class="secondary" href="guide.html">查看使用教程</a>
    </p>
  </main>
</body>
</html>
