    <radialGradient id="blobLow">
      <stop offset="0" stop-color="#C7E2FF" stop-opacity=".18"/>
      <stop offset=".55" stop-color="#C7E2FF" stop-opacity=".08"/>
      <stop offset="1" stop-color="#C7E2FF" stop-opacity="0"/>
    </radialGradient>
    <!-- 大粒子贴图：中心微亮近白，向外融入同族浅蓝 -->
    <radialGradient id="dotBigB">
      <stop offset="0" stop-color="#F2F8FF" stop-opacity=".95"/>
      <stop offset=".12" stop-color="#3689F5" stop-opacity=".85"/>
      <stop offset=".38" stop-color="#3689F5" stop-opacity=".22"/>
      <stop offset="1" stop-color="#3689F5" stop-opacity="0"/>
