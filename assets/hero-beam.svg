      <stop offset=".5" stop-color="#3689F5" stop-opacity=".12"/>
      <stop offset="1" stop-color="#3689F5" stop-opacity=".18"/>
    </linearGradient>
    <linearGradient id="gU3" x1="461" y1="778" x2="1613" y2="173" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563EB" stop-opacity=".26"/>
      <stop offset=".5" stop-color="#2563EB" stop-opacity=".42"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity=".56"/>
    </linearGradient>
    <!-- 氛围光斑：弧顶一团、示意卡后方一团、左下入口一团 -->
    <radialGradient id="blobArc">
      <stop offset="0" stop-color="#C7E2FF" stop-opacity=".34"/>
      <stop offset=".55" stop-color="#C7E2FF" stop-opacity=".16"/>
      <stop offset="1" stop-color="#C7E2FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobCard">
      <stop offset="0" stop-color="#D6E9FF" stop-opacity=".30"/>
      <stop offset=".55" stop-color="#D6E9FF" stop-opacity=".14"/>
      <stop offset="1" stop-color="#D6E9FF" stop-opacity="0"/>
