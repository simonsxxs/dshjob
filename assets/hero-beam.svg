<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 720" role="img" aria-label="浅雾蓝弧形光束静态背景">
  <!-- dshjob 首屏静态光束底图：无 JS / 暂停 / 减少动态 / 降级时的完整视觉。 -->
  <!-- 构图：主束自左下弧线扫向右侧约 50–60% 高度穿出，绕开左侧标题区； -->
  <!-- 一条次级平行束在下方、一条细束在右侧上行。三条束均为「氛围 / 光晕 / 核心」 -->
  <!-- 多层 stroke 复合，几何与 assets/hero-motion.js 的 BEAMS 归一化贝塞尔一致。 -->
  <defs>
    <!-- 主束沿程渐变：越靠穿出端（右上）越亮 -->
    <linearGradient id="gM1" x1="-115" y1="691" x2="1613" y2="317" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#58BDD9" stop-opacity=".03"/>
      <stop offset=".5" stop-color="#58BDD9" stop-opacity=".06"/>
      <stop offset="1" stop-color="#58BDD9" stop-opacity=".09"/>
    </linearGradient>
    <linearGradient id="gM2" x1="-115" y1="691" x2="1613" y2="317" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#58BDD9" stop-opacity=".04"/>
      <stop offset=".5" stop-color="#58BDD9" stop-opacity=".08"/>
      <stop offset="1" stop-color="#58BDD9" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="gM3" x1="-115" y1="691" x2="1613" y2="317" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3689F5" stop-opacity=".13"/>
      <stop offset=".5" stop-color="#3689F5" stop-opacity=".23"/>
      <stop offset="1" stop-color="#3689F5" stop-opacity=".32"/>
    </linearGradient>
    <linearGradient id="gM4" x1="-115" y1="691" x2="1613" y2="317" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3689F5" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#3689F5" stop-opacity=".38"/>
      <stop offset="1" stop-color="#3689F5" stop-opacity=".48"/>
    </linearGradient>
    <linearGradient id="gM5" x1="-115" y1="691" x2="1613" y2="317" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563EB" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#2563EB" stop-opacity=".80"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity=".93"/>
    </linearGradient>
    <!-- 次级束（下方平行） -->
    <linearGradient id="gL1" x1="-86" y1="792" x2="1584" y2="446" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#58BDD9" stop-opacity=".02"/>
      <stop offset=".5" stop-color="#58BDD9" stop-opacity=".05"/>
      <stop offset="1" stop-color="#58BDD9" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="gL2" x1="-86" y1="792" x2="1584" y2="446" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3689F5" stop-opacity=".08"/>
      <stop offset=".5" stop-color="#3689F5" stop-opacity=".15"/>
      <stop offset="1" stop-color="#3689F5" stop-opacity=".22"/>
    </linearGradient>
    <linearGradient id="gL3" x1="-86" y1="792" x2="1584" y2="446" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563EB" stop-opacity=".32"/>
      <stop offset=".5" stop-color="#2563EB" stop-opacity=".52"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity=".68"/>
    </linearGradient>
    <!-- 上行细束（右侧） -->
    <linearGradient id="gU1" x1="461" y1="778" x2="1613" y2="173" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#58BDD9" stop-opacity=".02"/>
      <stop offset=".5" stop-color="#58BDD9" stop-opacity=".04"/>
      <stop offset="1" stop-color="#58BDD9" stop-opacity=".07"/>
    </linearGradient>
    <linearGradient id="gU2" x1="461" y1="778" x2="1613" y2="173" gradientUnits="userSpaceOnUse">
