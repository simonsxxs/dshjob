      <stop offset=".12" stop-color="#58BDD9" stop-opacity=".85"/>
      <stop offset=".38" stop-color="#58BDD9" stop-opacity=".22"/>
      <stop offset="1" stop-color="#58BDD9" stop-opacity="0"/>
    </radialGradient>
    <!-- 极淡网格：只做在静态底图里，边缘用遮罩淡出 -->
    <pattern id="gridPat" width="90" height="90" patternUnits="userSpaceOnUse">
      <path d="M 90 0 H 0 V 90" fill="none" stroke="#3689F5" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
    <radialGradient id="gridFade" cx=".5" cy=".42" r=".75">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".55" stop-color="#fff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask"><rect width="1440" height="720" fill="url(#gridFade)"/></mask>
    <path id="pMain" d="M -115.2 691.2 C 432 518.4 1036.8 662.4 1612.8 316.8"/>
    <path id="pLow" d="M -86.4 792 C 489.6 633.6 1008 748.8 1584 446.4"/>
    <path id="pUp" d="M 460.8 777.6 C 892.8 417.6 1238.4 288 1612.8 172.8"/>
  </defs>

