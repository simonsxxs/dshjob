  <circle cx="1060" cy="285" r="290" fill="url(#blobCard)"/>
  <circle cx="235" cy="620" r="245" fill="url(#blobLow)"/>

  <!-- 次级束（下方平行，青为主，细而淡） -->
  <g fill="none" stroke-linecap="round">
    <use href="#pLow" stroke="url(#gL1)" stroke-width="42"/>
    <use href="#pLow" stroke="url(#gL2)" stroke-width="11"/>
    <use href="#pLow" stroke="url(#gL3)" stroke-width="1.8"/>
  </g>
  <!-- 上行细束（右侧，最细最淡） -->
  <g fill="none" stroke-linecap="round">
    <use href="#pUp" stroke="url(#gU1)" stroke-width="30"/>
    <use href="#pUp" stroke="url(#gU2)" stroke-width="8"/>
    <use href="#pUp" stroke="url(#gU3)" stroke-width="1.4"/>
  </g>
  <!-- 主光束（三层复合：氛围 → 光晕 → 核心亮线） -->
